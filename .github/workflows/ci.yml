name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared library and web app
        run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Synthesise CloudFormation
        run: npm run synth -- --quiet
        env:
          CDK_DEFAULT_REGION: eu-west-2
